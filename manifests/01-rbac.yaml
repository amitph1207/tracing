apiVersion: v1
kind: ServiceAccount
metadata:
  name: tracing-demo
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tracing-demo-foo-access
rules:
  - apiGroups: ["example.com"]
    resources: ["foos", "bars", "bazs"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["example.com"]
    resources: ["foos/status", "bars/status", "bazs/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tracing-demo-foo-access
subjects:
  - kind: ServiceAccount
    name: tracing-demo
    namespace: default
roleRef:
  kind: ClusterRole
  name: tracing-demo-foo-access
  apiGroup: rbac.authorization.k8s.io
