apiVersion: batch/v1
kind: Job
metadata:
  name: foo-update
  namespace: default
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: tracing-demo
      restartPolicy: Never
      containers:
        - name: creator
          image: tracing-demo-creator:local
          imagePullPolicy: IfNotPresent
          env:
            - name: NAMESPACE
              value: "default"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "tempo.default.svc.cluster.local:4317"
            - name: FOO_NAME
              value: "foo-chain"
            - name: DELAY_MILLIS
              value: "250"
            - name: ACTION
              value: "update"
            - name: MESSAGE
              value: "generation-two"
            - name: FAIL_STAGE
              value: "0"
            - name: FAIL_ATTEMPTS
              value: "0"
