apiVersion: batch/v1
kind: Job
metadata:
  name: foo-timeout
  namespace: default
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: tracing-demo
      restartPolicy: Never
      containers:
        - name: creator
          image: tracing-demo-creator:local
          imagePullPolicy: IfNotPresent
          env:
            - name: NAMESPACE
              value: "default"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "tempo.default.svc.cluster.local:4317"
            - name: FOO_NAME
              value: "foo-timeout"
            - name: DELAY_MILLIS
              value: "2000"
            - name: ROLLOUT_TIMEOUT
              value: "1s"
