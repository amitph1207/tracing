# Three deliberately small demo kinds. Each spec contains only message.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: foos.example.com
spec:
  group: example.com
  names:
    kind: Foo
    plural: foos
    singular: foo
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              message:
                type: string
          status:
            type: object
            properties:
              attemptGeneration:
                type: integer
                format: int64
              observedGeneration:
                type: integer
                format: int64
              attempts:
                type: integer
                format: int64
              lastTraceID:
                type: string
              childName:
                type: string
              lastError:
                type: string
